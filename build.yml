name: Build portable Windows OpenGL app
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Microsoft C compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile a 32-bit Release executable with static C runtime
        shell: cmd
        run: |
          mkdir PortableOpenGL
          cl /nologo /O2 /MT /W3 /I "freeglut\include\GL" "3DAssignment02_DarshaWaterhouse.c" /link /LIBPATH:"freeglut\lib" freeglut.lib opengl32.lib glu32.lib /OUT:"PortableOpenGL\Assignment01_DarshaWaterhouse.exe"
          copy "freeglut\bin\freeglut.dll" "PortableOpenGL\freeglut.dll"
      - name: Upload the compiled app
        uses: actions/upload-artifact@v4
        with:
          name: PortableOpenGL-Win32
          path: PortableOpenGL/
